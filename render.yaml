databases:
  - name: park-management-db
    plan: free
    databaseName: park_management
    user: park_management

services:
  - type: web
    name: park-management-system
    runtime: python
    plan: free
    rootDir: ParkManager_Fixed/backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn park_management.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: park-management-db
          property: connectionString
